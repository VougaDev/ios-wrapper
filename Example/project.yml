# The example app on the shell, generated by XcodeGen (`xcodegen` here): no .xcodeproj is committed.
# An app copies this folder into its own repository as `ios/` and changes the values marked APP.
name: VougaDevExample
options:
  bundleIdPrefix: com.vougadev
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  VougaDevShell:
    path: ..            # APP: url: https://github.com/VougaDev/ios-wrapper, exactVersion or revision
targets:
  VougaDevExample:      # APP: the app's name
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: VougaDevShell
        product: VougaDevShell
      - package: VougaDevShell
        product: VougaDevTracking
      - package: VougaDevShell
        product: VougaDevOfflineMap
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VougaDev Example
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, es]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The .tracking feature: background location while a mission is under way, While Using only (never Always).
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: Your position is shared with the people waiting while a mission you started is under way, and proves where each handover took place.
        NSLocationTemporaryUsageDescriptionDictionary:
          Tracking: Precise location tells the people waiting where you are and proves where each handover took place.
        # A form's photo input opens the camera.
        NSCameraUsageDescription: The camera takes the photo you attach to a form, such as a package at its handover.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vougadev.example   # APP: the app's own id, the same on both stores
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""      # APP: VougaDev's team id, once enrolled (README.md, "TestFlight")
  VougaDevExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: VougaDevExample
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vougadev.example.uitests
        TEST_TARGET_NAME: VougaDevExample
        SWIFT_VERSION: "5.0"
schemes:
  VougaDevExample:
    build:
      targets:
        VougaDevExample: all
    test:
      config: Debug
      targets:
        - VougaDevExampleUITests
