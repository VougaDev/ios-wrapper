# The shell's unit tests on an iOS Simulator and a build of the example app, on every push and pull request.
# No secret is used or needed: nothing is signed (the Apple Developer Program enrolment is pending, README.md).
name: ios
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Only here: an app's repository built on a copy of this one (merged as upstream) runs its own workflow instead.
    if: github.repository == 'VougaDev/ios-wrapper'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Xcode and Simulator
        run: |
          xcodebuild -version
          # The first available iPhone of the runner's newest runtime: names change with every Xcode.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if "iOS" in r), key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in runtimes[ios[-1]] if d["name"].startswith("iPhone")))')
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild -list
          xcodebuild test -scheme VougaDevShell-Package -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -resultBundlePath build/tests.xcresult | tee build-tests.log | grep -E "error:|warning:|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-tests.log
      - name: Example app and its UI tests on the Simulator
        run: |
          set -o pipefail
          brew install xcodegen
          cd Example && xcodegen
          xcodebuild build-for-testing -project VougaDevExample.xcodeproj -scheme VougaDevExample \
            -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath ../build/dd CODE_SIGNING_ALLOWED=NO \
            | tee ../build-app.log | grep -E "error:|warning:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" ../build-app.log
          xcodebuild test-without-building -project VougaDevExample.xcodeproj -scheme VougaDevExample \
            -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath ../build/dd \
            -resultBundlePath ../build/ui.xcresult \
            | tee ../build-ui.log | grep -E "error:|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" ../build-ui.log
      - name: Screenshots from the results
        if: always()
        run: |
          [ -d build/ui.xcresult ] || exit 0
          xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/attachments
          python3 .github/screenshots.py build/attachments screenshots
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
      - name: Nothing in this public repository reveals what the sites run on
        run: |
          # The sites' framework and servers, the internal names of the company's services, paths on a developer's machine.
          if git grep -nIiE 'framework|server|server|queue|database|accounts|client|/home/[a-z]|/Users/[a-z]|Projects/' -- . ':!.github/workflows/'; then exit 1; fi
          if git grep -nIwE 'the account service|WALLET|GeoGrid' -- . ':!.github/workflows/'; then exit 1; fi
      - name: An app's words, never a website's (App Review 4.2)
        run: python3 .github/check-words.py Sources Example/App
      - name: No other platform named in the app's texts (App Review 2.3.10)
        run: |
          if grep -rniE "android|google play|play store|\.apk" Sources/VougaDevShell/Resources Example/App Example/project.yml; then exit 1; fi
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build-tests.log
            build-app.log
            build-ui.log
            build/tests.xcresult
            build/ui.xcresult
          if-no-files-found: ignore
